name: Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  backend-tests:
    name: Backend test suite (Vitest)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: server/package-lock.json

      - name: Install server dependencies
        working-directory: server
        run: npm ci

      # The suite runs against the real (isolated-fixture) Supabase test
      # project — see server/test/README.md for why. SUPABASE_URL and
      # SUPABASE_SERVICE_ROLE_KEY must be set as repo secrets
      # (Settings -> Secrets and variables -> Actions) pointing at that
      # project; nothing here hardcodes credentials.
      - name: Run backend test suite
        working-directory: server
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          PORT: 4000
          CLIENT_ORIGIN: http://localhost:5173
        run: npm test

  client-tests:
    name: Frontend test suite (Vitest + RTL)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      # Component-level suite (Vitest + React Testing Library, jsdom) —
      # no real backend/network involved. See client/test/README.md for
      # what's covered and why.
      - name: Run frontend test suite
        working-directory: client
        run: npm test

  client-build:
    name: Client build sanity check
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: client/package-lock.json

      - name: Install client dependencies
        working-directory: client
        run: npm ci

      # Confirms the client still compiles, independent of the test
      # suite above.
      - name: Build client
        working-directory: client
        run: npx vite build
